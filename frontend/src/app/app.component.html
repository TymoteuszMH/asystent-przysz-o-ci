<div class="app-shell">
  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" (click)="toggleDrawer()" title="Menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <div class="brand" (click)="goHome()">
        <div class="brand-emblem">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">UDIP Bydgoszcz – Asystent Urzędnika</div>
          <div class="brand-sub">Urząd Miasta Bydgoszczy • Rejestr wniosków</div>
        </div>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#5f6368">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          [value]="globalSearch"
          (input)="onGlobalSearch($event)"
          placeholder="Szukaj po sygnaturze, temacie lub wydziale..."
        >
        <button
          class="search-clear"
          [class.visible]="globalSearch.length > 0"
          (click)="clearGlobalSearch()"
          title="Wyczyść"
        >✕</button>
      </div>
      <select class="year-select" [value]="selectedYear" (change)="onYearChange($event)">
        <option value="ALL">Wszystkie lata</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
      </select>
    </div>

    <div class="topbar-right">
      <div class="offline-pill">
        <span class="offline-dot"></span>
        <span>{{ backendStatus }}</span>
      </div>
    </div>
  </header>

  <!-- ===================== BODY ===================== -->
  <div class="app-body">
    <!-- Left Drawer -->
    <aside class="drawer" [class.collapsed]="drawerCollapsed">
      <button type="button" class="compose-btn" (click)="openNewModal()">
        <span>+ Nowy wniosek</span>
      </button>

      <nav class="nav-list" aria-label="Widoki listy">
        <button
          class="nav-tile"
          [class.active]="activeView === 'ALL' && !isCalendarView"
          (click)="setView('ALL')"
        >
          <span class="nav-tile-left"><span>Wszystkie wnioski</span></span>
          <span class="nav-count">{{ countAll }}</span>
        </button>
        <button
          class="nav-tile"
          [class.active]="activeView === 'URGENT' && !isCalendarView"
          (click)="setView('URGENT')"
        >
          <span class="nav-tile-left"><span>Pilne (dziś / jutro / po terminie)</span></span>
          <span class="nav-count urgent-badge">{{ countUrgent }}</span>
        </button>
        <button
          class="nav-tile"
          [class.active]="activeView === 'RESOLVED' && !isCalendarView"
          (click)="setView('RESOLVED')"
        >
          <span class="nav-tile-left"><span>Rozpatrzone</span></span>
          <span class="nav-count">{{ countResolved }}</span>
        </button>
        <button
          class="nav-tile"
          [class.active]="isCalendarView"
          (click)="openCalendar()"
        >
          <span class="nav-tile-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:2px;">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Kalendarz zadań</span>
          </span>
          <span class="nav-count" *ngIf="taskService.overdueTasksCount() > 0" [class.urgent-badge]="true">
            {{ taskService.overdueTasksCount() }}
          </span>
        </button>
      </nav>

      <!-- Calendar Widget (ukrywany w widoku dużego kalendarza) -->
      <div class="calendar-widget" *ngIf="!isCalendarView">
        <div class="cal-tile-header">
          <span class="cal-tile-title">Kalendarz terminów</span>
          <span class="cal-selected-label">{{ calSelectedLabel }}</span>
        </div>
        <div class="cal-nav">
          <button type="button" class="cal-arrow" (click)="calPrev()">‹</button>
          <span class="cal-month-label">{{ calMonthLabel }}</span>
          <button type="button" class="cal-arrow" (click)="calNext()">›</button>
        </div>
        <div class="cal-grid">
          <div class="cal-dow" *ngFor="let d of calDows">{{ d }}</div>
          <div *ngFor="let cell of calCells" class="cal-day"
            [class.empty]="!cell.day"
            [class.today-outline]="cell.isToday"
            [class.due-red]="cell.dueCls === 'due-red'"
            [class.due-orange]="cell.dueCls === 'due-orange'"
            [class.due-blue]="cell.dueCls === 'due-blue'"
            [class.selected-day]="cell.iso === calSelectedDate"
            (click)="cell.day && onCalDayClick(cell.iso)"
            [title]="cell.day ? 'Kliknij, aby filtrować wnioski według dnia.' : ''"
          >{{ cell.day || '' }}</div>
        </div>
        <div class="cal-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#d93025;"></span>Dziś / po terminie</span>
          <span class="legend-item"><span class="legend-dot" style="background:#e37400;"></span>Jutro</span>
          <span class="legend-item"><span class="legend-dot" style="background:#0b57d0;"></span>W terminie</span>
        </div>
      </div>
    </aside>

    <!-- Main workspace -->
    <main class="workspace">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast" [class.show]="toastVisible" id="toastBox">{{ toastMessage }}</div>

  <!-- Nowy wniosek modal -->
  <app-new-request-modal
    [isOpen]="isNewModalOpen"
    [totalCasesCount]="countAll"
    (close)="closeNewModal()"
    (created)="onNewCaseCreated($event)"
  ></app-new-request-modal>
</div>
