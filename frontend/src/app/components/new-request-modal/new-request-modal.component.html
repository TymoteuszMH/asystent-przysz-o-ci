<div class="modal-backdrop" [class.open]="isOpen" (click)="onClose()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 style="font-size: 16px; font-weight: 700; color: #041e49; margin: 0;">Nowy wniosek UDIP</h2>
      <button type="button" class="icon-btn" (click)="onClose()" title="Zamknij" aria-label="Zamknij">✕</button>
    </div>

    <div class="modal-body">
      @if (errorMessage) {
        <div class="modal-alert-error">
          {{ errorMessage }}
        </div>
      }

      <div class="meta-grid-2">
        <div class="field-box">
          <label for="newSygnatura">Sygnatura</label>
          <input
            type="text"
            id="newSygnatura"
            [(ngModel)]="sygnatura"
            placeholder="np. BKS.IV.1431.601.2026"
          />
        </div>
        <div class="field-box">
          <label for="newDateReceived">Data wpływu</label>
          <input
            type="date"
            id="newDateReceived"
            [(ngModel)]="dateReceived"
          />
        </div>
      </div>

      <div class="field-box">
        <label for="newSubject">Temat wniosku</label>
        <input
          type="text"
          id="newSubject"
          [(ngModel)]="subject"
          placeholder="Krótki zwięzły temat wniosku..."
        />
      </div>

      <div class="field-box">
        <label for="newContent">Treść wniosku</label>
        <textarea
          id="newContent"
          rows="4"
          [(ngModel)]="content"
          placeholder="Wpisz treść zapytania obywatela lub wklej treść pisma..."
        ></textarea>
      </div>

      <div class="quick-creator-hint">
        <span>💡 Potrzebujesz wgrać plik PDF/TXT i przeanalizować podobieństwo spraw?</span>
        <button type="button" class="hint-link-btn" (click)="goToFullCreator()">
          Otwórz zaawansowany kreator AI &rarr;
        </button>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="udip-btn udip-btn-secondary" (click)="onClose()" [disabled]="isSaving">
        Anuluj
      </button>
      <button type="button" class="udip-btn udip-btn-primary" (click)="saveCase()" [disabled]="isSaving">
        @if (isSaving) {
          Zapisywanie w API...
        } @else {
          Zapisz wniosek
        }
      </button>
    </div>
  </div>
</div>
